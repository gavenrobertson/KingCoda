number: 12
slug: moat-water-volume
title: Moat Water Volume
difficulty: Hard
tags: [Two Pointers, Stack]
signature:
  function: trappedWater
  params:
    - { name: walls, type: 'int[]' }
  returns: long
limits: { timeMs: 1000, memoryMb: 256 }
constraints:
  - '1 ≤ walls.length ≤ 10⁵'
  - '0 ≤ walls[i] ≤ 10⁹'
examples:
  - args: { walls: [0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1] }
    output: 6
  - args: { walls: [4, 2, 0, 3, 2, 5] }
    output: 9
hints:
  - text: The water above one column is decided by the tallest wall to its left and the tallest wall to its right.
    unlockAfterWrong: 2
  - text: water[i] = min(maxLeft[i], maxRight[i]) − walls[i]. Two prefix-max arrays make it O(n).
    unlockAfterWrong: 4
  - text: For O(1) extra space, move two pointers inward from the side with the lower running maximum — that side's water level is already settled.
    unlockAfterWrong: 6
