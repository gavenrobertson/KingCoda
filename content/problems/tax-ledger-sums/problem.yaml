number: 14
slug: tax-ledger-sums
title: Tax Ledger Sums
difficulty: Easy
tags: [Prefix Sums, Arrays]
signature:
  function: ledgerSums
  params:
    - { name: taxes, type: 'int[]' }
    - { name: queries, type: 'int[][]' }
  returns: 'long[]'
limits: { timeMs: 1000, memoryMb: 256 }
constraints:
  - '1 ≤ taxes.length ≤ 10⁵'
  - '-10⁹ ≤ taxes[i] ≤ 10⁹'
  - '1 ≤ queries.length ≤ 10⁵'
  - 'queries[q] = [l, r] with 0 ≤ l ≤ r < taxes.length'
examples:
  - args: { taxes: [3, -1, 4, 1, 5], queries: [[0, 2], [1, 3], [4, 4]] }
    output: [6, 4, 5]
  - args: { taxes: [1000000000, 1000000000, 1000000000], queries: [[0, 2]] }
    output: [3000000000]
    explanation: The total is bigger than a 32-bit integer can hold.
hints:
  - text: Answering each query by adding up its range is too slow when there are 10⁵ of both. What can you precompute once?
    unlockAfterWrong: 2
  - text: Let prefix[i] be the sum of the first i entries. The sum of [l, r] is prefix[r + 1] − prefix[l]. Use 64-bit integers.
    unlockAfterWrong: 4
