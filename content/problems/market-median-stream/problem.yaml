number: 10
slug: market-median-stream
title: Market Median Stream
difficulty: Hard
tags: [Heaps, Design]
signature:
  function: runningMedians
  params:
    - { name: prices, type: 'int[]' }
  returns: 'double[]'
checker: { kind: float, tolerance: 0.00001 }
limits: { timeMs: 1000, memoryMb: 256 }
constraints:
  - '1 ≤ prices.length ≤ 10⁵'
  - '-10⁶ ≤ prices[i] ≤ 10⁶'
examples:
  - args: { prices: [5, 15, 1, 3] }
    output: [5, 10, 5, 4]
    explanation: 'After 4 prices the sorted list is [1,3,5,15]; the median is (3 + 5) / 2 = 4.'
  - args: { prices: [2, 2] }
    output: [2, 2]
hints:
  - text: Re-sorting after every price is O(n² log n). You only ever need the middle of the list.
    unlockAfterWrong: 2
  - text: Keep the lower half in a max-heap and the upper half in a min-heap, with sizes equal or the lower half one bigger. The median comes from the tops.
    unlockAfterWrong: 4
