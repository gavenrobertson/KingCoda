name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Design token contrast (WCAG AA)
        run: pnpm tokens:check
      - name: Migrations match schema
        run: |
          pnpm --filter @kingcoda/db exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run: pnpm --filter @kingcoda/db generate"
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Validate the problem bank
        run: node tools/pipeline/src/cli.ts validate
      - name: Build Worker bundle
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kingcoda/web exec playwright install --with-deps chromium
      # The solve journey runs real code: a judge box like the deployed one (cached from the judge job).
      - uses: docker/setup-buildx-action@v3
      - name: Build judge image
        uses: docker/build-push-action@v6
        with:
          context: judge
          tags: kingcoda-judge
          load: true
          cache-from: type=gha,scope=judge
          cache-to: type=gha,scope=judge,mode=max
      - name: Start judge box
        run: |
          docker run -d --name kcjudge --privileged --cgroupns private -p 18080:8080 --memory 3g --cpus 1 kingcoda-judge
          for i in $(seq 1 30); do curl -fs localhost:18080/healthz && break; sleep 1; done
      - run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Box logs
        if: failure()
        run: docker logs kcjudge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: judge/kc-run/go.mod
      - name: kc-run vet + unit tests
        working-directory: judge/kc-run
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - uses: docker/setup-buildx-action@v3
      - name: Build judge image
        uses: docker/build-push-action@v6
        with:
          context: judge
          tags: kingcoda-judge
          load: true
          cache-from: type=gha,scope=judge
          cache-to: type=gha,scope=judge,mode=max
      - name: Start judge box
        run: |
          docker run -d --name kcjudge --privileged --cgroupns private -p 18080:8080 --memory 3g --cpus 1 kingcoda-judge
          for i in $(seq 1 30); do curl -fs localhost:18080/healthz && break; sleep 1; done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Hostile-code probe suite
        run: |
          curl -fsS localhost:18080/introspect | jq '{cgroupsEnabled, sandboxedProcess}'
          node judge/probes/run.ts http://localhost:18080
      - name: Verdicts through the box
        run: node judge/probes/verdicts.ts http://localhost:18080
      - name: Box logs
        if: failure()
        run: docker logs kcjudge
